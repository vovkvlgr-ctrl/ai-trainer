<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ШІ-тренажер Академії Viatec: практичні задачі з роботи з ШІ-помічником.">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ШІ-тренажер Академії</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: одна колонка до 920px — список практичних задач, далі задача як робочий аркуш з п’ятьма кроками зверху вниз */
:root {
  --bg: #F2F3EE;
  --surface: #FCFCF9;
  --ink: #18211F;
  --muted: #56625C;
  --line: #D9DDD3;
  --accent: #D9502B;
  --accent-ink: #FFF8F4;
  --accent-soft: #FBE4DB;
  --ok: #1D7F52;
  --ok-bg: #DFF1E6;
  --warn: #8A5A0B;
  --warn-bg: #FAEED3;
  --bad: #B3321F;
  --bad-bg: #FADFD9;
  --code-bg: #1E2826;
  --code-ink: #F2F3EE;
  --f-display: 'Unbounded', 'Trebuchet MS', sans-serif;
  --f-body: 'Golos Text', 'Segoe UI', Arial, sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #1A201E; --ink: #ECEFEA; --muted: #A2ACA6; --line: #2E3734;
    --accent: #FF7A52; --accent-ink: #1A0D08; --accent-soft: #3A2219;
    --ok: #5CCB95; --ok-bg: #173226; --warn: #E9B551; --warn-bg: #362A12; --bad: #FF8A78; --bad-bg: #3A1D19;
    --code-bg: #0B0F0E; --code-ink: #E6EAE4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1A201E; --ink: #ECEFEA; --muted: #A2ACA6; --line: #2E3734;
  --accent: #FF7A52; --accent-ink: #1A0D08; --accent-soft: #3A2219;
  --ok: #5CCB95; --ok-bg: #173226; --warn: #E9B551; --warn-bg: #362A12; --bad: #FF8A78; --bad-bg: #3A1D19;
  --code-bg: #0B0F0E; --code-ink: #E6EAE4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.app { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
p, ul, ol { margin: 0; }
button, textarea { font: inherit; color: inherit; }
button:focus-visible, textarea:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.top h1 { font-size: 22px; }
.top p { font-size: 14px; color: var(--muted); }
.total { font-size: 14px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.total b { color: var(--ink); }

/* home */
.hero { display: flex; flex-direction: column; gap: 12px; }
.hero h2 { font-size: clamp(26px, 4.2vw, 38px); max-width: 720px; }
.hero p { color: var(--muted); font-size: 18px; max-width: 68ch; }
.how { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.how div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; color: var(--muted); }
.how b { display: block; color: var(--accent); font-family: var(--f-display); font-size: 15px; margin-bottom: 2px; }
.tasks { display: flex; flex-direction: column; gap: 12px; }
.task {
  text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 22px; display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; align-items: center; transition: border-color .15s;
}
.task:hover { border-color: var(--accent); }
.task h3 { font-size: 18px; }
.task .sub { color: var(--muted); font-size: 15px; grid-column: 1; }
.task .meta { font-size: 13px; color: var(--muted); grid-column: 1; }
.task .st { grid-row: 1 / span 3; grid-column: 2; }
.pill { font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.pill.done { background: var(--ok-bg); color: var(--ok); }
.note { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }

/* task view */
.back { align-self: flex-start; background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px 0; font-weight: 600; }
.back:hover { color: var(--accent); }
.mhead { display: flex; flex-direction: column; gap: 8px; }
.tag { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.mhead h2 { font-size: clamp(24px, 3.6vw, 32px); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 3vw, 28px); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h3 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
.panel h3 .no { width: 30px; height: 30px; border-radius: 9px; display: inline-grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 14px; flex-shrink: 0; }
.panel.locked { opacity: .5; }
.facts { padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.material { background: var(--bg); border-radius: 12px; padding: 14px 16px; white-space: pre-wrap; font-size: 15px; line-height: 1.6; max-height: 320px; overflow: auto; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
textarea { width: 100%; min-height: 170px; resize: vertical; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; line-height: 1.55; }
textarea:focus { border-color: var(--accent); outline: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { cursor: pointer; border: none; border-radius: 12px; padding: 12px 20px; font-weight: 700; background: var(--accent); color: var(--accent-ink); text-decoration: none; display: inline-block; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.status { font-size: 14px; color: var(--ok); min-height: 1em; }

.checks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.chk { border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.chk b { font-size: 15px; }
.chk.yes { background: var(--ok-bg); } .chk.yes b { color: var(--ok); }
.chk.no { background: var(--warn-bg); } .chk.no b { color: var(--warn); }
.alert { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.alert.bad { background: var(--bad-bg); } .alert.bad b { color: var(--bad); }
.alert.ok { background: var(--ok-bg); } .alert.ok b { color: var(--ok); }
.alert.warn { background: var(--warn-bg); } .alert.warn b { color: var(--warn); }
details { background: var(--bg); border-radius: 14px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 700; }
.code { font-family: 'Courier New', monospace; font-size: 15px; line-height: 1.6; background: var(--code-bg); color: var(--code-ink); border-radius: 14px; padding: 16px 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
details .code { margin-top: 10px; }
.ais { display: flex; gap: 10px; flex-wrap: wrap; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list label { display: flex; gap: 12px; align-items: flex-start; background: var(--bg); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.list input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
.donebox { background: var(--ok-bg); border-radius: 14px; padding: 16px 18px; }
.donebox b { color: var(--ok); }

@media (max-width: 720px) {
  .how { grid-template-columns: 1fr 1fr; }
  .checks { grid-template-columns: 1fr 1fr; }
  .task { grid-template-columns: 1fr; }
  .task .st { grid-row: auto; grid-column: 1; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===== Тема «ШІ-ядро»: глибокий космос, сітка, неонові голограми (одна темна тема свідомо) ===== */
:root:root:root {
  --bg: #070B1A;
  --surface: rgba(16, 24, 52, 0.74);
  --ink: #E6EEFF;
  --muted: #93A6CB;
  --line: rgba(98, 140, 255, 0.28);
  --accent: #28E0FF;
  --accent-ink: #04121A;
  --accent-soft: rgba(40, 224, 255, 0.14);
  --violet: #9B6BFF;
  --ok: #3DF5B0; --ok-bg: rgba(61, 245, 176, 0.12);
  --warn: #FFC857; --warn-bg: rgba(255, 200, 87, 0.12);
  --bad: #FF5C9A; --bad-bg: rgba(255, 92, 154, 0.13);
  --code-bg: #030612; --code-ink: #BFF6FF;
  --f-display: 'Exo 2', 'Trebuchet MS', sans-serif;
  --f-mono: 'JetBrains Mono', 'Courier New', monospace;
  color-scheme: dark;
}
body {
  background:
    radial-gradient(1100px 600px at 90% -10%, rgba(155, 107, 255, 0.28), transparent 60%),
    radial-gradient(900px 520px at -10% 5%, rgba(40, 224, 255, 0.16), transparent 60%),
    #070B1A;
  background-attachment: fixed;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(98, 140, 255, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(98, 140, 255, 0.08) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 80%); mask-image: linear-gradient(to bottom, #000 0%, transparent 80%);
}
.app { position: relative; z-index: 1; }

/* шапка */
.brand { display: flex; align-items: center; gap: 16px; }
.core { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; position: relative;
  background: radial-gradient(circle at 35% 35%, #E8FDFF 0%, #28E0FF 30%, #6C3BFF 72%, #1A1050 100%);
  box-shadow: 0 0 22px rgba(40, 224, 255, 0.7), 0 0 60px rgba(155, 107, 255, 0.4);
  animation: corePulse 3.2s ease-in-out infinite; }
.core::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 1px dashed rgba(40, 224, 255, 0.55); animation: coreSpin 14s linear infinite; }
@keyframes corePulse { 50% { box-shadow: 0 0 34px rgba(40, 224, 255, 0.95), 0 0 84px rgba(155, 107, 255, 0.55); } }
@keyframes coreSpin { to { transform: rotate(360deg); } }
.top h1 { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: 0.08em; }
.top p { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.04em; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.online { color: var(--ok); letter-spacing: 0.12em; text-transform: uppercase; }
.online::before { content: "●"; margin-right: 6px; animation: blink 1.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.total { font-family: var(--f-mono); font-size: 13px; background: var(--surface); border-color: var(--line); box-shadow: 0 0 18px rgba(40, 224, 255, 0.12); }

/* заголовки */
.hero h2, .mhead h2 { font-weight: 800; background: linear-gradient(90deg, #E6EEFF 0%, #28E0FF 55%, #B794FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tag { font-family: var(--f-mono); letter-spacing: 0.14em; }
.tag::before { content: "◇ "; }
.panel h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: 0.02em; }

/* панелі-голограми */
.panel, .task, .how div { background: var(--surface); border: 1px solid var(--line); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.panel { position: relative; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(40, 224, 255, 0.08); }
.panel::before, .panel::after { content: ""; position: absolute; width: 20px; height: 20px; pointer-events: none; border: 2px solid var(--accent); filter: drop-shadow(0 0 6px rgba(40, 224, 255, 0.7)); }
.panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; border-top-left-radius: var(--radius); }
.panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; border-bottom-right-radius: var(--radius); }
.panel.locked::before, .panel.locked::after { border-color: var(--muted); filter: none; }
.panel h3 .no { width: 36px; height: 32px; border-radius: 0; clip-path: polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0 50%); background: linear-gradient(135deg, #28E0FF, #9B6BFF); color: #04121A; font-family: var(--f-mono); font-weight: 600; }
.how div { border-radius: 14px; }
.how b { font-family: var(--f-mono); color: var(--accent); text-shadow: 0 0 10px rgba(40, 224, 255, 0.6); }
.task { position: relative; overflow: hidden; }
.task:hover { border-color: var(--accent); box-shadow: 0 0 26px rgba(40, 224, 255, 0.25); }
.task::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, #28E0FF, #9B6BFF); opacity: 0; transition: opacity .2s; }
.task:hover::after { opacity: 1; }
.pill { font-family: var(--f-mono); font-size: 12px; background: rgba(3, 6, 18, 0.6); border: 1px solid var(--line); }
.pill.done { border-color: rgba(61, 245, 176, 0.45); box-shadow: 0 0 12px rgba(61, 245, 176, 0.2); }
.meta { font-family: var(--f-mono); font-size: 12px; }

/* кнопки */
.btn { background: linear-gradient(135deg, #28E0FF, #7A8CFF); color: #04121A; box-shadow: 0 0 18px rgba(40, 224, 255, 0.35); text-transform: uppercase; letter-spacing: 0.05em; font-size: 14px; transition: box-shadow .2s, transform .2s; }
.btn:hover { box-shadow: 0 0 30px rgba(40, 224, 255, 0.65); transform: translateY(-1px); }
.btn.ghost { background: rgba(3, 6, 18, 0.5); color: var(--ink); border: 1px solid var(--line); box-shadow: none; text-transform: none; letter-spacing: 0; font-size: 15px; }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 18px rgba(40, 224, 255, 0.3); }
.back { font-family: var(--f-mono); font-size: 14px; }

/* поля і термінали */
textarea { background: rgba(3, 6, 18, 0.75); border: 1px solid var(--line); font-family: var(--f-mono); font-size: 15px; caret-color: var(--accent); }
textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(40, 224, 255, 0.15), 0 0 26px rgba(40, 224, 255, 0.2); }
textarea::placeholder { color: rgba(147, 166, 203, 0.6); }
.material { background: rgba(3, 6, 18, 0.65); border: 1px solid var(--line); font-family: var(--f-mono); font-size: 14px; }
.code { border: 1px solid rgba(40, 224, 255, 0.3); font-family: var(--f-mono); font-size: 14px; box-shadow: inset 0 0 30px rgba(40, 224, 255, 0.06); }
.code::before { content: "> запит"; display: block; color: var(--accent); font-size: 12px; letter-spacing: 0.12em; margin-bottom: 8px; opacity: 0.8; }
details, .list label { background: rgba(3, 6, 18, 0.5); border: 1px solid var(--line); }
.list label:hover { border-color: var(--accent); }

/* статуси */
.chk { border: 1px solid transparent; }
.chk b { font-family: var(--f-mono); font-size: 14px; letter-spacing: 0.03em; }
.chk.yes { border-color: rgba(61, 245, 176, 0.4); }
.chk.no { border-color: rgba(255, 200, 87, 0.35); }
.alert { border: 1px solid transparent; }
.alert.ok { border-color: rgba(61, 245, 176, 0.35); }
.alert.warn { border-color: rgba(255, 200, 87, 0.35); }
.alert.bad { border-color: rgba(255, 92, 154, 0.5); box-shadow: 0 0 22px rgba(255, 92, 154, 0.18); }
.donebox { border: 1px solid rgba(61, 245, 176, 0.5); box-shadow: 0 0 26px rgba(61, 245, 176, 0.22); }
.note { border-top-color: var(--line); font-size: 13px; }

@media (prefers-reduced-motion: reduce) {
  .core, .core::after, .online::before { animation: none !important; }
}

/* ===== Тема «Живе сяйво»: світлий фон, анімована аврора, скляні панелі з неоновими кутами ===== */
:root:root:root:root {
  --bg: #F3F5FF;
  --surface: rgba(255, 255, 255, 0.78);
  --ink: #141A3A;
  --muted: #4E5A80;
  --line: rgba(108, 77, 255, 0.22);
  --accent: #6C4DFF;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(108, 77, 255, 0.12);
  --ok: #0C8F61; --ok-bg: rgba(12, 143, 97, 0.12);
  --warn: #9A6200; --warn-bg: rgba(255, 184, 0, 0.18);
  --bad: #C9295F; --bad-bg: rgba(214, 51, 108, 0.12);
  --code-bg: #141A46; --code-ink: #D8F6FF;
  color-scheme: light;
}
body { background: #F3F5FF; }
body::before {
  z-index: 1;
  background-image: linear-gradient(rgba(108, 77, 255, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(108, 77, 255, 0.07) 1px, transparent 1px);
}
body::after {
  content: ""; position: fixed; inset: -20%; pointer-events: none; z-index: 0;
  background:
    radial-gradient(38% 34% at 18% 18%, rgba(0, 212, 255, 0.42), transparent 70%),
    radial-gradient(34% 34% at 82% 14%, rgba(140, 92, 255, 0.42), transparent 70%),
    radial-gradient(40% 38% at 72% 84%, rgba(255, 79, 163, 0.32), transparent 70%),
    radial-gradient(34% 30% at 14% 86%, rgba(140, 240, 110, 0.34), transparent 70%);
  filter: blur(30px);
  animation: aurora 26s ease-in-out infinite alternate;
}
@keyframes aurora {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); }
  50% { transform: translate(3%, -2%) rotate(8deg) scale(1.08); }
  100% { transform: translate(-3%, 2%) rotate(-6deg) scale(1.04); }
}
.app { z-index: 2; }

.core { background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, #00D4FF 30%, #6C4DFF 66%, #FF4FA3 100%); box-shadow: 0 0 22px rgba(0, 212, 255, 0.6), 0 0 50px rgba(140, 92, 255, 0.45); }
.core::after { border-color: rgba(108, 77, 255, 0.55); }
@keyframes corePulse { 50% { box-shadow: 0 0 32px rgba(0, 212, 255, 0.85), 0 0 70px rgba(255, 79, 163, 0.45); } }
.top h1 { background: linear-gradient(90deg, #141A3A, #6C4DFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
.total { background: var(--surface); box-shadow: 0 6px 20px rgba(76, 60, 200, 0.12); }

.hero h2, .mhead h2 { background: linear-gradient(90deg, #141A3A 0%, #6C4DFF 50%, #00A6CF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.panel { box-shadow: 0 12px 40px rgba(76, 60, 200, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9); }
.panel::before, .panel::after { border-color: #6C4DFF; filter: drop-shadow(0 0 6px rgba(108, 77, 255, 0.55)); }
.panel::after { border-color: #00B8D9; filter: drop-shadow(0 0 6px rgba(0, 184, 217, 0.6)); }
.panel h3 .no { background: linear-gradient(135deg, #00D4FF, #6C4DFF 55%, #FF4FA3); color: #FFFFFF; }
.how div { box-shadow: 0 6px 20px rgba(76, 60, 200, 0.08); }
.how b { color: #6C4DFF; text-shadow: none; }
.task { box-shadow: 0 6px 22px rgba(76, 60, 200, 0.08); }
.task:hover { border-color: #6C4DFF; box-shadow: 0 10px 30px rgba(108, 77, 255, 0.22); transform: translateY(-2px); }
.task::after { width: 4px; background: linear-gradient(180deg, #00D4FF, #6C4DFF, #FF4FA3); }
.pill { background: rgba(255, 255, 255, 0.75); }

.btn { background: linear-gradient(135deg, #6C4DFF, #00B8D9); background-size: 160% 160%; color: #FFFFFF; box-shadow: 0 6px 20px rgba(108, 77, 255, 0.35); }
.btn:hover { background-position: 100% 0; box-shadow: 0 10px 30px rgba(108, 77, 255, 0.5); }
.btn.ghost { background: rgba(255, 255, 255, 0.75); color: var(--ink); }
.btn.ghost:hover { color: #6C4DFF; border-color: #6C4DFF; box-shadow: 0 6px 20px rgba(108, 77, 255, 0.2); }

textarea { background: rgba(255, 255, 255, 0.92); }
textarea:focus { border-color: #6C4DFF; box-shadow: 0 0 0 3px rgba(108, 77, 255, 0.15), 0 8px 26px rgba(108, 77, 255, 0.18); }

  // ---------- жива нейромережа на сцені ----------
  var NET = { raf: 0, size: null };
  function startNet(cv, small) {
    cancelAnimationFrame(NET.raf);

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var W = 0, H = 0, nodes = [], pulses = [], D = small ? 110 : 140, last = 0;
    function size() {

      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.round(Math.min(110, Math.max(30, W * H / (small ? 6000 : 7000))));
      nodes = [];

    }
    NET.size = size; size();
    function core() { return { x: W * (small ? 0.86 : 0.78), y: H * (small ? 0.5 : 0.42), R: Math.min(W, H) * (small ? 0.42 : 0.38) }; }
    function frame(t) {
      ctx.clearRect(0, 0, W, H);
      var C = core(), pulse = 1 + 0.07 * Math.sin(t / 700);
      var g = ctx.createRadialGradient(C.x, C.y, 0, C.x, C.y, C.R * 1.4 * pulse);
      g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.08, 'rgba(111,230,255,0.85)'); g.addColorStop(0.3, 'rgba(140,92,255,0.45)'); g.addColorStop(0.6, 'rgba(255,79,163,0.12)'); g.addColorStop(1, 'rgba(20,10,60,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(C.x, C.y, C.R * 1.4 * pulse, 0, Math.PI * 2); ctx.fill();

        ctx.save(); ctx.rotate(t / (4000 + k * 2500) * (k % 2 ? -1 : 1));

      }
      ctx.restore(); ctx.setLineDash([]);
      var i, j, a, b, dx, dy, d;
      for (i = 0; i < nodes.length; i++) {
        a = nodes[i]; a.x += a.vx; a.y += a.vy;
        if (a.x < 0 || a.x > W) a.vx *= -1; if (a.y < 0 || a.y > H) a.vy *= -1;
      }
      for (i = 0; i < nodes.length; i++) {
        a = nodes[i];
        for (j = i + 1; j < nodes.length; j++) {
          b = nodes[j]; dx = a.x - b.x; dy = a.y - b.y; d = Math.sqrt(dx * dx + dy * dy);
          if (d < D) { ctx.strokeStyle = 'rgba(170,200,255,' + ((1 - d / D) * 0.42).toFixed(3) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }

      }

        for (j = 0; j < nodes.length; j++) { b = nodes[j]; if (b === a) continue; dx = a.x - b.x; dy = a.y - b.y; d = Math.sqrt(dx * dx + dy * dy); if (d < best && Math.random() < 0.6) { best = d; target = b; } }
        pulses.push({ a: a, b: target, t: 0, c: a.c, sp: 0.018 + Math.random() * 0.02 });

        var tx = p.b ? p.b.x : C.x, ty = p.b ? p.b.y : C.y;
        var x = p.a.x + (tx - p.a.x) * p.t, y = p.a.y + (ty - p.a.y) * p.t;

    }

        if (all) {
          if (!S.done[t.id]) { S.done[t.id] = true; save(S); renderTotal(); }
          db.innerHTML = '<div class="donebox"><b>Задачу виконано!</b><p>Збережіть вдалий запит у свою бібліотеку (урок 1.1) — він знадобиться в роботі.</p></div><div class="row">' + (TASKS[TASKS.indexOf(t) + 1] ? '<button class="btn" id="toNext">Далі: ' + esc(TASKS[TASKS.indexOf(t) + 1].title) + ' →</button>' : '') + '<button class="btn ghost" id="toList">До всіх задач</button></div>';
          document.getElementById('toList').addEventListener('click', function () { location.hash = ''; });
          var tn = document.getElementById('toNext');
          if (tn) tn.addEventListener('click', function () { location.hash = TASKS[TASKS.indexOf(t) + 1].id; });
        } else {
          var left = Array.prototype.filter.call(boxes, function (b) { return !b.checked; }).length;
          db.innerHTML = '<p class="small muted">Не виконано пунктів: ' + left + '. Уточніть у тому ж чаті, що виправити, — або допрацюйте запит на кроці 1.</p>';
        }
      }
      boxes.forEach(function (b) { b.addEventListener('change', upd); });
    }
    if (!silent) after.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function route() {
    cancelAnimationFrame(NET.raf); NET.size = null;
    var h = (location.hash || '').replace('#', '');
    var t = TASKS.filter(function (x) { return x.id === h; })[0];
    renderTotal();
    if (t) taskView(t); else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</html>
